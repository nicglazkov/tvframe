<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TV Photos</title>
<meta name="description" content="Folders and photos for the living room TV.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='18' rx='2' fill='%23222'/%3E%3Crect x='11' y='26' width='10' height='2' fill='%23222'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TV Photos">
<style>
/* TV photo manager. Talks to server/photos_api.py on port 8153. One file on purpose: no build, no libraries. */
:root{
  --bg:#FFFFFF; --bg-2:#F4F4F2; --ink:#161616; --ink-2:#5E5E5B; --ink-3:#8C8C88; --line:#E3E3DF; --line-2:#CFCFCA;
  --accent:#1F5E4E; --accent-ink:#FFFFFF; --bad:#A2321F; --warn:#B07A12; --menu:#FFFFFF; --shadow:0 8px 28px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.08);
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141414; --bg-2:#1E1E1D; --ink:#EDEDEA; --ink-2:#A9A9A4; --ink-3:#7C7C78; --line:#2C2C2A; --line-2:#3C3C39;
  --accent:#5FB59C; --accent-ink:#0E1A16; --bad:#E0715C; --warn:#E0AE4A; --menu:#232322; --shadow:0 10px 30px rgba(0,0,0,.5);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--sans)}
button{font:inherit;color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.crumbs{display:flex;align-items:center;gap:6px;min-width:0;flex:1;font-size:18px;font-weight:600}
.crumbs a{color:var(--ink-2);text-decoration:none;white-space:nowrap}
.crumbs a:hover{color:var(--ink)}
.crumbs .sep{color:var(--ink-3)}
.crumbs .short{display:none;font-size:28px;line-height:1;padding:0 6px 0 0}
.crumbs .here{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.status.building i{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.status.error i{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--bg);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--bg-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.dots{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:8px;border:1px solid var(--line-2);background:var(--bg);cursor:pointer;flex:none;padding:0}
.dots:hover{background:var(--bg-2)}
.dots svg{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.progress{height:3px;background:var(--line)}
.progress[hidden]{display:none}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.upmsg{font-size:13px;color:var(--ink-2);padding:8px 0 0}
.upmsg:empty{display:none}

/* folders */
.folders{list-style:none;margin:12px 0 0;padding:0}
.folder{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.folder a{display:flex;align-items:center;gap:14px;flex:1;min-width:0;color:inherit;text-decoration:none;padding:2px 0}
.folder .cover{width:64px;height:48px;border-radius:6px;background:var(--bg-2);object-fit:cover;flex:none}
.folder .name{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder .meta{font-size:13px;color:var(--ink-2)}
.folder a:hover .name{text-decoration:underline;text-underline-offset:3px}
.newrow{margin-top:16px}
.folder .meta .sch{color:var(--ink-2)}
.folder .meta .sch.wait{color:var(--warn)}

/* what the TV shows right now, with skip buttons */
.now{display:flex;align-items:center;gap:14px;margin-top:16px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);min-height:82px}
.now .thumbs{display:flex;gap:4px;flex:none;height:56px}
.now .thumbs img{height:56px;width:auto;max-width:96px;border-radius:6px;object-fit:cover;display:block;background:var(--line)}
.now .txt{min-width:0;flex:1}
.now .k{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--ink-3)}
.now .k i{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.now.off .k i{background:var(--ink-3)}
.now .l{font-weight:600;font-size:15px;margin-top:2px;overflow-wrap:anywhere}
.now .m{font-size:13px;color:var(--ink-2)}
.now .ctl{display:flex;gap:8px;flex:none}
.now .ctl .dots svg{width:20px;height:20px}
.now .ctl .fav.on{color:var(--bad)}
.rk .favb{background:none;border:0;padding:4px;color:var(--ink-3);cursor:pointer;border-radius:6px;display:inline-flex}
.rk .favb svg{width:18px;height:18px}.rk .favb.on{color:var(--bad)}.rk .favb:hover{color:var(--ink)}
.rk .lk{font-size:13px;line-height:1.35;min-width:150px}.rk .lk small{display:block;color:var(--ink-3);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.now .swap{animation:swapin .24s cubic-bezier(.2,0,0,1)}
@keyframes swapin{from{opacity:0;transform:translateX(var(--from,8px))}to{opacity:1;transform:none}}
@media (max-width:600px){.now{flex-wrap:wrap}.now .ctl{width:100%;justify-content:flex-end}}

/* folder schedule */
.note{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bg-2);font-size:14px;color:var(--ink-2);display:flex;gap:10px;align-items:center;justify-content:space-between}
.note a{color:var(--accent);font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.menu .dates{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;padding:4px 10px 6px;font-size:14px;color:var(--ink-2)}
.menu select{font:15px var(--sans);padding:7px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--ink);width:100%}
.menu .chips{display:flex;flex-direction:column;gap:2px;padding:0 0 4px;max-height:220px;overflow:auto}
.menu .chips button{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:14px}
.menu .chips button span{color:var(--ink-2);white-space:nowrap}
.menu .chips button:hover,.menu .chips button:focus-visible{background:var(--bg-2);outline:none}
.menu .chips button.mine{font-weight:600}
.menu .dis{opacity:.4;pointer-events:none}

/* photos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px 14px;margin-top:16px}
.tile{position:relative;min-width:0}
.tile .img{position:relative;display:block;width:100%;aspect-ratio:4/3;border-radius:6px;overflow:hidden;background:var(--bg-2);border:0;padding:0;cursor:zoom-in}
.tile .img img{width:100%;height:100%;object-fit:cover;display:block}
.tile .img .wait{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:var(--ink-3);text-align:center;padding:10px}
.tile .vid{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px}
.tile .dots{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.94);border:0;color:#161616;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tile .dots:hover{background:#fff}
.tile .fn{margin-top:6px;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .st{font-size:12px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap}
.tile .st b{font-weight:600}
.tile .st .off{color:var(--bad)}
.tile.off .img img,.tile.similar .img img{opacity:.4;filter:grayscale(1)}
.empty{color:var(--ink-2);padding:40px 0;text-align:center}
.drop{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--accent) 18%,transparent);border:3px dashed var(--accent);display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--ink);pointer-events:none}
.drop[hidden]{display:none}

/* the one menu: a popover by the button, a bottom sheet on phones */
.menu{position:fixed;z-index:30;min-width:220px;max-width:min(340px,calc(100vw - 24px));background:var(--menu);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;font-size:15px}
.menu[hidden]{display:none}
.menu .h{font-size:12px;color:var(--ink-3);padding:6px 10px 2px;font-weight:600}
.menu .t{padding:6px 10px 8px;color:var(--ink-2);font-size:13px;overflow-wrap:anywhere}
.menu a.i{text-decoration:none;color:inherit;box-sizing:border-box}
.menu button.i,.menu a.i{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer}
.menu .i:hover,.menu .i:focus-visible{background:var(--bg-2);outline:none}
.menu button.i .ck{width:16px;flex:none;color:var(--accent);font-weight:700}
.menu button.i.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.menu input{width:100%;font:16px var(--sans);padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--ink);margin:2px 0 8px}
.menu .row{display:flex;gap:8px;justify-content:flex-end;padding:2px 4px 4px}
.scrim{position:fixed;inset:0;z-index:29;background:rgba(0,0,0,.28)}
.scrim[hidden]{display:none}
@media (max-width:600px){
  .menu{left:0 !important;right:0;bottom:0;top:auto !important;max-width:none;width:100%;border-radius:14px 14px 0 0;padding:8px 8px calc(12px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
  .menu button.i{padding:13px 12px;font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
  .bar .label{display:none}
  .crumbs .full,.crumbs .sep{display:none}
  .crumbs .short{display:inline}
  .status:not(.building):not(.error) span{display:none}
}

dialog.view{border:0;padding:0;background:#000;max-width:100vw;max-height:100vh;width:100vw;height:100vh}
dialog.view::backdrop{background:#000}
dialog.view img,dialog.view video{width:100%;height:100%;object-fit:contain;display:block}
dialog.view .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#111;font-size:22px;cursor:pointer}
dialog.view .cap{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:14px;pointer-events:none}
/* clips: the caption goes under the video, not over its controls, so the seek bar can be dragged */
dialog.view[open]:has(video){display:flex;flex-direction:column}
dialog.view:has(video) #vbody{flex:1;min-height:0}
dialog.view:has(video) .cap{position:static;background:none;padding-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;max-width:calc(100vw - 32px);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.toast.bad{background:var(--bad);color:#fff}
/* rebuild progress */
.prog{margin-top:16px;padding:14px 14px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg-2);animation:swapin .24s cubic-bezier(.2,0,0,1)}
.prog .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.prog .ttl{font-weight:600;font-size:15px}
.prog .pct{font-variant-numeric:tabular-nums;font-weight:600;font-size:22px;letter-spacing:-.01em}
.prog .sub{font-size:13px;color:var(--ink-2);margin-top:1px}
.prog .track{height:6px;border-radius:3px;background:var(--line);margin:10px 0 12px;overflow:hidden}
.prog .track i{display:block;height:100%;width:100%;background:var(--accent);border-radius:3px;transform-origin:left;transform:scaleX(var(--p,0));transition:transform .6s cubic-bezier(.2,0,0,1)}
.prog ol{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.prog li{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.prog li .ic{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:10px;line-height:1}
.prog li.done{color:var(--ink)}
.prog li.done .ic{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.prog li.running{color:var(--ink);font-weight:600}
.prog li.running .ic{border-color:var(--warn);background:radial-gradient(var(--warn) 0 3px,transparent 3.5px);animation:pulse 1.1s ease-in-out infinite}
.prog li.failed{color:var(--bad)}
.prog li.failed .ic{border-color:var(--bad);background:var(--bad);color:#fff}
.prog li .r{font-size:12px;color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
.prog .chip{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:1px 5px;border-radius:4px;border:1px solid var(--line-2);color:var(--ink-3);vertical-align:1px}
.prog li.running .chip{border-color:var(--warn);color:var(--warn)}
.prog .gpu{display:flex;align-items:center;gap:10px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.prog .gpu .meter{flex:none;width:64px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.prog .gpu .meter i{display:block;height:100%;width:100%;background:var(--warn);transform-origin:left;transform:scaleX(var(--p,0));transition:transform .6s cubic-bezier(.2,0,0,1)}
.prog.fail{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}

/* folder: photos or ranking */
.seg{display:inline-flex;max-width:100%;overflow-x:auto;scrollbar-width:none;margin-top:14px;padding:3px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line);position:relative}
.seg a{position:relative;z-index:1;white-space:nowrap;padding:6px 14px;border-radius:7px;font-size:14px;font-weight:600;color:var(--ink-2);text-decoration:none;transition:color .2s}
.seg a[aria-current="page"]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;border-radius:7px;background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12);transition:left .28s cubic-bezier(.2,0,0,1),width .28s cubic-bezier(.2,0,0,1)}
.rk-intro{font-size:13.5px;color:var(--ink-2);margin:12px 0 4px;max-width:760px}
.rk{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px;font-variant-numeric:tabular-nums}
.rk th{text-align:left;font-size:12px;font-weight:600;color:var(--ink-3);padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.rk th button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.rk th button:hover,.rk th[aria-sort] button{color:var(--ink)}
.rk th .ar{display:inline-block;width:8px;transition:transform .2s}
.rk th[aria-sort="ascending"] .ar{transform:rotate(180deg)}
.rk td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.rk tr.row{cursor:pointer;transition:background .15s}
.rk tr.row:hover{background:var(--bg-2)}
.rk tr.row.open{background:var(--bg-2)}
.rk .n{color:var(--ink-3);width:34px}
.rk .th img{width:72px;height:48px;object-fit:cover;border-radius:5px;display:block;background:var(--bg-2)}
.rk .th{width:88px}
.rk .fnw{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .fn small{display:block;color:var(--ink-3);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.prog.compact{cursor:pointer}.prog.compact ol,.prog.compact .gpu{display:none}
.prog.compact .track{margin-bottom:2px}
.rk tr.off .th img{opacity:.4;filter:grayscale(1)}
.bar2{display:flex;align-items:center;gap:7px;min-width:76px}
.bar2 span{width:30px;text-align:right}
.bar2 i{flex:1;height:5px;border-radius:3px;background:var(--line);overflow:hidden;min-width:30px}
.bar2 i b{display:block;height:100%;width:100%;background:var(--accent);transform-origin:left;transform:scaleX(var(--p));animation:grow .7s cubic-bezier(.2,0,0,1) both}
.bar2.big i{height:7px}
.bar2.big span{font-weight:600;color:var(--ink)}
@keyframes grow{from{transform:scaleX(0)}}
.rk .why{color:var(--ink-2);max-width:240px;overflow-wrap:anywhere}
.rk .pill2{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--line);color:var(--ink-2);white-space:nowrap}
.rk .pill2.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.rk .pill2.off{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.rk tr.det td{padding:0;border-bottom:0}
.rk .detw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.2,0,0,1)}
.rk tr.det.open .detw{grid-template-rows:1fr}
.rk tr.det.open td{border-bottom:1px solid var(--line)}
.rk .deti{overflow:hidden}
.rk .detc{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:18px;padding:14px 8px 18px}
.rk .detc img{width:100%;border-radius:8px;display:block;cursor:zoom-in;background:var(--bg-2)}
.rk dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:0;font-size:13.5px}
.rk dt{color:var(--ink-3)}
.rk dd{margin:0;overflow-wrap:anywhere}
.sw{display:inline-flex;gap:3px;vertical-align:-2px}
.sw i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.08)}
.rk-clips{margin-top:22px}
.rkf{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0 6px}
.rkf button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);border-radius:999px;padding:5px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
.rkf button span{font-weight:500;color:var(--ink-3);font-variant-numeric:tabular-nums}
.rkf button:hover{border-color:var(--ink-3);color:var(--ink)}
.rkf button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}.rkf button.on span{color:inherit;opacity:.7}
.rkq{display:flex;align-items:center;gap:6px;margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--bg);color:var(--ink-3);min-width:min(260px,100%)}
.rkq:focus-within{border-color:var(--accent)}
.rkq svg{width:15px;height:15px;flex:none}
.rkq input{border:0;outline:0;background:none;font:inherit;font-size:13.5px;color:var(--ink);width:100%;padding:2px 0}
.rk .rk-none{padding:28px 8px;color:var(--ink-3);text-align:center}
.rk-none .lnk{border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0 4px;text-decoration:underline}
@media (max-width:600px){.rkq{margin-left:0;flex:1 1 100%}}
.rk-clips h3{font-size:14px;margin:0 0 4px}
@media (max-width:760px){
  .rk .c-sh,.rk .c-ex,.rk .c-no,.rk .c-fa,.rk .c-why{display:none}
  .rk .detc{grid-template-columns:1fr}
}
@media (max-width:480px){.rk .c-ae,.rk .fn small{display:none}.rk .th img{width:56px;height:40px}.rk .th{width:66px}.rk .fnw{max-width:96px}.rk td,.rk th{padding-left:5px;padding-right:5px}.bar2{min-width:58px}.bar2 i{min-width:20px}.rk .th img{width:48px;height:36px}.rk .th{width:56px}.rk .pill2{white-space:normal}.rk .n{width:22px}}
/* home: the way into every photo at once */
.mix{margin-top:16px;padding:14px 16px 12px;border:1px solid var(--line);border-radius:12px}
.mixtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.mix h2{margin:0;font-size:16px;font-weight:600}
.mixn{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.mix input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:28px;margin:6px 0 0;background:transparent;cursor:pointer;--p:11%}
.mix input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line-2) var(--p))}
.mix input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line-2)}
.mix input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
.mix input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:var(--bg);border:1px solid var(--line-2);box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .15s cubic-bezier(.2,0,0,1)}
.mix input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--bg);border:1px solid var(--line-2);box-shadow:0 1px 4px rgba(0,0,0,.22)}
.mix input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
.mix input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mixends{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;color:var(--ink-3)}
.mixends #mixw{color:var(--ink-2);font-weight:600;text-align:center}
.mixlinks{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.mixlinks a{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:600;color:var(--accent);text-decoration:none}
.mixlinks a svg{width:16px;height:16px}
.mixlinks a:hover{text-decoration:underline}
.allcard{display:flex;align-items:center;gap:14px;margin-top:16px;padding:10px 14px 10px 10px;border:1px solid var(--line);border-radius:12px;color:inherit;text-decoration:none;transition:background .15s,border-color .15s}
.allcard:hover{background:var(--bg-2);border-color:var(--line-2)}
.allcard .mos{display:grid;grid-template-columns:repeat(2,31px);grid-template-rows:repeat(2,23px);gap:2px;border-radius:7px;overflow:hidden;flex:none;background:var(--line)}
.allcard .mos img,.allcard .mos span{width:100%;height:100%;object-fit:cover;display:block;background:var(--bg-2)}
.allcard .tx{flex:1;min-width:0}
.allcard .tx b{display:block;font-size:16px;font-weight:600}
.allcard .tx span{display:block;font-size:13px;color:var(--ink-2)}
.allcard>svg{width:18px;height:18px;color:var(--ink-3);flex:none;transition:transform .2s cubic-bezier(.2,0,0,1)}
.allcard:hover>svg{transform:translateX(3px)}

/* all photos: tools */
.atools{position:sticky;top:var(--hh,59px);z-index:4;background:var(--bg);margin:0 -16px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
.arow{display:flex;gap:8px;align-items:center}
.search{flex:1;min-width:0;position:relative}
.search input{width:100%;font:15px var(--sans);height:36px;padding:0 30px 0 34px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg);color:var(--ink);-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search>svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;border-radius:50%;background:var(--line);color:var(--ink-2);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center;padding:0}
.search .clr[hidden]{display:none}
.iseg{display:inline-flex;padding:2px;border-radius:9px;border:1px solid var(--line);background:var(--bg-2);flex:none}
.iseg button{min-width:32px;height:30px;padding:0 9px;border:0;border-radius:7px;background:none;display:grid;place-items:center;cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:600;transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.iseg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.iseg svg{width:16px;height:16px}
.sortsel{font:14px var(--sans);height:36px;padding:0 8px;border:1px solid var(--line-2);border-radius:9px;background:var(--bg);color:var(--ink);flex:none}
.chipsrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px -16px 0;padding:0 16px 1px}
.chipsrow::-webkit-scrollbar{display:none}
.chip2{flex:none;border:1px solid var(--line-2);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;cursor:pointer;color:var(--ink-2);transition:background .2s,color .2s,border-color .2s}
.chip2:hover{border-color:var(--ink-3)}
.chip2 span{color:var(--ink-3);margin-left:5px;font-variant-numeric:tabular-nums;transition:color .2s}
.chip2[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip2[aria-pressed="true"] span{color:inherit;opacity:.65}
.chip2.zero{opacity:.5}
.acount{font-size:13px;color:var(--ink-3);margin:10px 0 0;display:flex;justify-content:space-between;gap:10px}
.acount button{border:0;background:none;padding:0;color:var(--accent);font-weight:600;cursor:pointer;font-size:13px}

/* all photos: folders you can fold */
.ag{margin-top:6px;content-visibility:auto;contain-intrinsic-size:auto 520px}
.agh{display:flex;align-items:center;gap:6px;padding:10px 0 8px;border-bottom:1px solid var(--line);margin-bottom:12px}
.ag.shut .agh{margin-bottom:0}
.agc{flex:1;display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px 0;cursor:pointer;text-align:left;min-width:0}
.agc svg{width:16px;height:16px;transition:transform .25s cubic-bezier(.2,0,0,1);color:var(--ink-3);flex:none}
.ag.shut .agc svg{transform:rotate(-90deg)}
.agc b{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agc span{font-size:13px;color:var(--ink-3);white-space:nowrap}
.gsel{display:inline-flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:500;padding:6px 4px;white-space:nowrap}
.gsel:hover{color:var(--ink)}
.box{position:relative;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:background .15s,border-color .15s;flex:none;background:var(--bg)}
.box svg{width:12px;height:12px;color:var(--accent-ink);opacity:0;transform:scale(.5);transition:opacity .15s,transform .22s cubic-bezier(.3,1.6,.5,1)}
.box::after{content:"";width:8px;height:2px;border-radius:1px;background:var(--accent-ink);position:absolute;opacity:0}
[aria-checked="true"] .box,[aria-checked="mixed"] .box{background:var(--accent);border-color:var(--accent)}
[aria-checked="true"] .box svg{opacity:1;transform:none}
[aria-checked="mixed"] .box::after{opacity:1}
.ag.shut .agb{display:none}
.ag.opening .agb{animation:reveal .3s cubic-bezier(.2,0,0,1)}
@keyframes reveal{from{opacity:0;transform:translateY(-8px)}}

/* all photos: tiles */
.ag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px 10px;padding-bottom:6px}
.it{position:relative;min-width:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.ag-grid .im{display:block;position:relative;width:100%;aspect-ratio:4/3;border:0;padding:0;border-radius:8px;overflow:hidden;background:var(--bg-2);cursor:pointer;transition:transform .2s cubic-bezier(.2,0,0,1),box-shadow .2s}
.it .im img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .25s,filter .25s}
.it .im .wait{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--ink-3)}
.ag-grid .it.sel .im{transform:scale(.92);box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--accent)}
.it.off .im img,.it.auto .im img{opacity:.42;filter:grayscale(1)}
.it.similar .im img{opacity:.62;filter:grayscale(.55)}
.cb{position:absolute;z-index:2;top:3px;left:3px;width:36px;height:36px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;transition:transform .2s cubic-bezier(.2,0,0,1)}
.cb i{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(255,255,255,.95);background:rgba(0,0,0,.22);box-shadow:0 1px 3px rgba(0,0,0,.35);display:grid;place-items:center;transition:background .15s,border-color .15s,transform .2s cubic-bezier(.2,0,0,1)}
.cb svg{width:13px;height:13px;color:var(--accent-ink);opacity:0;transform:scale(.4);transition:opacity .15s,transform .22s cubic-bezier(.3,1.6,.5,1)}
.it.sel .cb i{background:var(--accent);border-color:var(--accent)}
.it.sel .cb svg{opacity:1;transform:none}
.cb:active i{transform:scale(.88)}
@media (hover:hover){
  .ag-grid .cb{opacity:0;transition:opacity .15s,transform .2s cubic-bezier(.2,0,0,1)}
  .ag-grid .it:hover .cb,.selecting .ag-grid .cb,.ag-grid .it.sel .cb,.ag-grid .cb:focus-visible{opacity:1}
  .ag-grid .it:hover .im{box-shadow:0 2px 10px rgba(0,0,0,.18)}
  .ag-grid .it.sel:hover .im{box-shadow:0 0 0 2px var(--bg),0 0 0 4.5px var(--accent)}
}
.it .sc{position:absolute;right:6px;top:6px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;padding:1px 6px;border-radius:6px;background:rgba(0,0,0,.58);color:#fff;line-height:1.5}
.it .bl{position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:4px;flex-wrap:wrap;pointer-events:none}
.bdg{font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;background:rgba(0,0,0,.62);color:#fff;line-height:1.55;white-space:nowrap}
.bdg.off{background:var(--bad);color:#fff}
.bdg.pick{background:var(--accent);color:var(--accent-ink)}
.ag-grid .cap{margin-top:6px;font-size:12.5px;line-height:1.3;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.going{opacity:0;transform:scale(.85);transition:opacity .22s,transform .22s cubic-bezier(.2,0,0,1)}

/* all photos: rows */
.ag-list .it,.lhead{display:grid;grid-template-columns:30px 64px minmax(0,1.5fr) 118px 150px 92px minmax(0,1.3fr);align-items:center;gap:12px}
.ag-list .it{padding:7px 8px 7px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.ag-list .it:hover{background:var(--bg-2)}
.ag-list .it.sel{background:color-mix(in srgb,var(--accent) 11%,transparent)}
.ag-list .cb{position:static;width:30px;height:30px}
.ag-list .cb i{width:20px;height:20px;border-radius:6px;border-color:var(--line-2);background:var(--bg);box-shadow:none}
.ag-list .im{width:64px;height:44px;border:0;padding:0;border-radius:5px;overflow:hidden;background:var(--bg-2);cursor:zoom-in;position:relative;display:block}
.ag-list .im .vb{position:absolute;left:3px;bottom:3px;font-size:9.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.6);border-radius:3px;padding:0 3px}
.ag-list .nmw{min-width:0}
.ag-list .nm{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-list .sub{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag-list .c-lv{font-size:13px;color:var(--ink-2)}
.ag-list .c-why{font-size:13px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lhead{padding:12px 8px 6px 2px;font-size:12px;font-weight:600;color:var(--ink-3);border-bottom:1px solid var(--line)}
.pill3{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:var(--line);color:var(--ink-2);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.pill3.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.pill3.off{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill3.pick{background:var(--accent);color:var(--accent-ink)}
.ag-list .stm{display:none}
.cmeta{display:flex;align-items:center;gap:10px;min-width:0}
.cmeta small{font-size:12px;color:var(--ink-3);white-space:nowrap}

/* clips: how good each moment looks, with the part the TV plays */
.spk{display:block;flex:none;overflow:visible}
.spk .ln{fill:none;stroke:var(--ink-3);stroke-width:1.4;stroke-linejoin:round;stroke-linecap:round}
.spk .hl{fill:color-mix(in srgb,var(--accent) 17%,transparent)}
.spk .lb{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.spk .hl{transform-box:fill-box;transform-origin:left;animation:grow .7s cubic-bezier(.2,0,0,1) both}

/* the selection bar */
.selbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));z-index:25;transform:translate(-50%,calc(100% + 40px));transition:transform .34s cubic-bezier(.2,0,0,1),visibility 0s .34s;visibility:hidden;display:flex;align-items:center;gap:6px;padding:7px;background:var(--menu);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);max-width:calc(100vw - 24px)}
.selbar.show{transform:translate(-50%,0);visibility:visible;transition:transform .34s cubic-bezier(.2,0,0,1)}
.selbar .lead{display:flex;align-items:center;gap:2px}
.selbar .n{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums;padding:0 8px 0 2px}
.selbar .all{border:0;background:none;color:var(--accent);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:6px;white-space:nowrap;border-radius:6px}
.selbar .all:hover{background:var(--bg-2)}
.selbar .all[hidden]{display:none}
.selbar .x{width:32px;height:32px;border-radius:8px;border:0;background:none;cursor:pointer;color:var(--ink-2);display:grid;place-items:center;padding:0}
.selbar .x svg{width:16px;height:16px}
.selbar .x:hover{background:var(--bg-2);color:var(--ink)}
.selbar .acts{display:flex;gap:6px}
.selbar .btn{padding:7px 11px;border-color:var(--line)}
.selbar .btn svg{width:16px;height:16px;flex:none}
.selbar .btn.danger{color:var(--bad)}
.selbar .sep{width:1px;height:24px;background:var(--line);flex:none;margin:0 2px}
.selbar .bump{animation:bump .26s cubic-bezier(.2,0,0,1)}
@keyframes bump{40%{transform:scale(1.07)}}
body.selecting .wrap,body.cselecting .wrap,body.pselecting .wrap{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
body.selecting .toast,body.cselecting .toast,body.pselecting .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
.toast{transform:translate(-50%,10px);transition:opacity .2s,transform .28s cubic-bezier(.2,0,0,1),bottom .3s cubic-bezier(.2,0,0,1);display:flex;align-items:center;gap:14px}
.toast.show{transform:translate(-50%,0)}
.toast.act{pointer-events:auto}
.toast .u{border:0;background:none;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:2px 0;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}

/* duplicates */
.dintro{font-size:13.5px;color:var(--ink-2);margin:14px 0 2px;max-width:780px}
.dg{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:12px 12px 6px;content-visibility:auto;contain-intrinsic-size:auto 440px}
.dgh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.dgh b{font-size:15px;font-weight:600}
.dgh span{display:block;font-size:13px;color:var(--ink-2)}
.dgr{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,250px);gap:12px;overflow-x:auto;padding:3px 3px 10px;margin:0 -3px;scroll-snap-type:x proximity;scrollbar-width:thin}
.dc{margin:0;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;scroll-snap-align:start;transition:border-color .3s,box-shadow .3s,background .3s;min-width:0}
.dc.pick{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.dc.also{border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.dc.also .tag{background:color-mix(in srgb,var(--accent) 80%,#000);color:#fff}
.dc .im{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;border-radius:7px;overflow:hidden;background:var(--bg-2);cursor:zoom-in}
.dc .im img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s,filter .3s}
.dc.off .im img{opacity:.42;filter:grayscale(1)}
.dc .tag{position:absolute;left:6px;top:6px;font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;line-height:1.6;background:rgba(0,0,0,.62);color:#fff;transition:background .3s,color .3s}
.dc.pick .tag{background:var(--accent);color:var(--accent-ink)}
.dc.off .tag{background:var(--bad);color:#fff}
.dc .nm{font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc .met{display:grid;grid-template-columns:58px 1fr;gap:3px 8px;align-items:center;font-size:12.5px;color:var(--ink-3)}
.dc .met .bar2{min-width:0}
.dc .met .bar2 span{width:24px}
.dc .why{font-size:12.5px;color:var(--ink-2);line-height:1.35;min-height:2.7em}
.dc .act{margin-top:auto;display:flex;align-items:center;gap:6px;min-height:36px}
.dc .act .btn{flex:1;justify-content:center;padding:6px 8px;font-size:13px}
.dc .shown{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--accent);padding:0 4px}
.dc .shown svg{width:15px;height:15px}
.dc .act>*{animation:swapin .26s cubic-bezier(.2,0,0,1)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* folder ranking: clips */
.rk .c-spk{width:112px}.rk .c-spk svg{width:100px;height:auto;display:block}
.rk .lk,.rk .c-st{min-width:130px}
/* phone: each clip is a card (thumb, name and heart on top, then score, look and TV status), no sideways scrolling */
@media (max-width:600px){
  .rk-clips table.rk,.rk-clips tbody{display:block}
  .rk-clips thead{display:none}
  .rk-clips tr{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;gap:6px 12px;padding:12px 0;border-bottom:1px solid var(--line)}
  .rk-clips td{display:block;border:0;padding:0;min-width:0}
  .rk-clips td.th{grid-row:1/span 4;width:auto}.rk-clips .th img{width:72px;height:48px}
  .rk-clips td.fn{grid-column:2}.rk-clips td.c-fv{grid-column:3;grid-row:1}
  .rk-clips td.c-q,.rk-clips td.lk,.rk-clips td.c-st{grid-column:2/4}
  .rk-clips .fnw{max-width:none}.rk-clips .fn small{display:block}
  .rk-clips .clipst{flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px}.rk-clips .clipst small{max-width:none}
  .rk-clips tr{position:relative}.rk-clips td.ck{position:absolute;left:-7px;top:5px;z-index:1;width:auto}
  .rk-clips .rcb i{border-color:rgba(255,255,255,.95);background:rgba(0,0,0,.22);box-shadow:0 1px 3px rgba(0,0,0,.35)}
}
.rk .clipst{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
.rk .clipst small{color:var(--ink-2);font-size:12px;line-height:1.3;max-width:240px}
/* clip ranking: pick many, a preview on hover, trim the part the TV plays */
.rk-clips .ck{width:38px;padding-right:0}
.rcb{position:static;width:30px;height:30px}
.rcb i{border-color:var(--line-2);background:var(--bg);box-shadow:none}
.rcb[aria-checked="true"] i,.rcb[aria-checked="mixed"] i{background:var(--accent);border-color:var(--accent)}
.rcb[aria-checked="true"] svg{opacity:1;transform:none}
.rcb[aria-checked="mixed"] svg{display:none}
.rcb[aria-checked="mixed"] i::after{content:"";width:10px;height:2px;border-radius:1px;background:var(--accent-ink)}
.rk-clips tr.sel{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.rk-clips .selecting-c td{cursor:pointer}
.trim [hidden]{display:none!important}

<body>
<header>
  <div class="bar">
    <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
    <span class="status" id="status" role="status"><i></i><span></span></span>
    <span id="actions" style="display:flex;gap:8px"></span>
  </div>
  <div class="progress" id="progress" hidden><i></i></div>
</header>
<main class="wrap">
  <div class="upmsg" id="upmsg"></div>
  <div id="progbox"></div>
  <div id="nowbox"></div>
  <div id="mixbox" hidden></div>
  <div id="view"></div>
</main>
<input type="file" id="pick" multiple hidden accept="image/jpeg,image/heic,image/png,video/mp4,video/quicktime,.heic,.jpg,.jpeg,.png,.mp4,.mov">
<div class="drop" id="drop" hidden></div>
<div class="scrim" id="scrim" hidden></div>
<div class="menu" id="menu" role="menu" hidden></div>
<dialog class="view" id="viewer"><button class="x" id="vx" aria-label="Close">×</button><div id="vbody" style="height:100%"></div><div class="cap" id="vcap"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const API = `${location.protocol}//${location.hostname}:8153`;
const BRIDGE = `${location.protocol}//${location.hostname}:8154`;   // server/bridge.py: what the TV shows, skip commands
const CHEV = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d ? 'M9 5l7 7-7 7' : 'M15 5l-7 7 7 7'}"/></svg>`;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const fmtDate = d => d && /^\d{4}-\d\d-\d\d/.test(d) ? `${MON[+d.slice(5, 7) - 1]} ${+d.slice(8, 10)}, ${d.slice(0, 4)}` : '';
const DOTS = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>';
const LEVELS = [['less', 'Less often'], ['normal', 'Normal'], ['more', 'More often'], ['most', 'Most often'], ['fav', 'Favorite, the most of all']];
const HEART = f => `<svg viewBox="0 0 24 24" fill="${f ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-9.3-9.4C1.6 8 3.6 4.5 7.1 4.5c2 0 3.6 1.1 4.9 2.9 1.3-1.8 2.9-2.9 4.9-2.9 3.5 0 5.5 3.5 4.4 6.6-1.8 4.8-9.3 9.4-9.3 9.4z"/></svg>`;

const OK = /\.(jpe?g|heic|png|mp4|mov)$/i;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let lib = { folders: [], status: {} }, uploading = false, pollT = null, reachable = true;

// ---------- data ----------
async function refresh() {
  clearTimeout(pollT);
  try { lib = await fetch(API + '/lib', { cache: 'no-store' }).then(r => r.json()); reachable = true; }
  catch { reachable = false; }
  render();
  const busy = lib.status?.state === 'building' || uploading || lib.folders.some(f => f.files.some(x => x.state === 'new'));
  pollT = setTimeout(refresh, busy ? 4000 : 30000);
}
async function post(path, body) {
  const r = await fetch(API + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
  if (!r.ok) throw new Error(r.error || 'Something went wrong.');
  return r;
}
async function act(path, body, done) {
  closeMenu();
  try { const r = await post(path, body); if (done) toast(typeof done === 'function' ? done(r) : done); }
  catch (e) { toast(e.message, true); }
  refresh();
}

// ---------- views ----------
const route = () => { const m = location.hash.match(/^#\/f\/([^/]+)/); return m ? decodeURIComponent(m[1]) : null; };
const tab = () => /^#\/f\/[^/]+\/rank$/.test(location.hash) ? 'rank' : 'photos';
window.addEventListener('hashchange', () => { window.scrollTo(0, 0); render(); });

function render() {
  const name = route(), folder = lib.folders.find(f => f.name === name);
  const st = reachable ? lib.status || {} : { state: 'error', text: 'Cannot reach the server' };
  $('status').className = 'status ' + (st.state || '');
  $('status').lastElementChild.textContent = st.text || '';
  if (isAll()) return renderAll();
  delete $('view').dataset.shell;
  if (name && !folder && reachable && lib.folders.length) { location.hash = ''; return; }
  if (folder) return renderFolder(folder);
  $('crumbs').innerHTML = '<span class="here">TV Photos</span>';
  $('actions').innerHTML = `<button class="btn" id="newf" type="button">+ <span class="label">New folder</span></button>
    <button class="dots" type="button" id="appmenu" aria-label="More" aria-haspopup="menu">${DOTS}</button>`;
  $('newf').onclick = e => newFolderMenu(e.currentTarget);
  $('appmenu').onclick = e => menu.hidden || opener !== e.currentTarget ? appMenu(e.currentTarget) : closeMenu();
  $('nowbox').hidden = false; renderNow(); renderMix();
  const rows = lib.folders.map(f => {
    const cover = f.files.find(x => x.thumb && !x.video) || f.files.find(x => x.thumb);
    const off = f.files.filter(x => x.state === 'off').length, nw = f.files.filter(x => x.state === 'new').length;
    const meta = [`${f.files.length} ${f.files.length === 1 ? 'item' : 'items'}`, off && `${off} off`, nw && `${nw} being added`].filter(Boolean).join(' · ')
      + (f.schedule ? `<br><span class="sch ${f.schedule.on ? '' : 'wait'}">${esc(f.schedule.text)}</span>` : '');
    return `<li class="folder">
      <a href="#/f/${encodeURIComponent(f.name)}">${cover ? `<img class="cover" src="${esc(cover.thumb)}" alt="">` : '<span class="cover"></span>'}
        <span style="min-width:0"><div class="name">${esc(f.name)}</div><div class="meta">${meta}</div></span></a>
      <button class="dots" type="button" data-fmenu="${esc(f.name)}" aria-label="Options for ${esc(f.name)}" aria-haspopup="menu">${DOTS}</button></li>`;
  }).join('');
  const every = lib.folders.flatMap(f => f.files), vids = every.filter(x => x.video).length;
  const mos = lib.folders.map(f => f.files.find(x => x.thumb && !x.video)).filter(Boolean).slice(0, 4);
  const allcard = every.length ? `<a class="allcard" href="#/all"><span class="mos">${[0, 1, 2, 3].map(i => mos[i] ? `<img src="${esc(mos[i].thumb)}" alt="">` : '<span></span>').join('')}</span>
    <span class="tx"><b>All photos</b><span>${plural(every.length - vids, 'photo', 'photos')} and ${plural(vids, 'clip', 'clips')} from every folder. Pick many at once, hide them or change how often they come up, and sort out duplicates.</span></span>${CHEV(1)}</a>` : '';
  $('view').innerHTML = lib.folders.length ? `${allcard}<ul class="folders">${rows}</ul>`
    : `<p class="empty">${reachable ? 'No folders yet. Make one with New folder.' : 'Cannot reach the server on port 8153.'}</p>`;
}

/* home: how many of every 100 slides are clips (prod.json clip_share, the TV's Sequencer spreads them out) */
let mixSaved = null, mixT;
function mixWords(n) {
  if (n <= 0) return 'Photos only';
  if (n >= 100) return 'Clips only';
  if (n === 50) return 'Photos and clips take turns';
  return n < 50 ? `About 1 clip every ${Math.round(100 / n)} slides` : `About 1 photo every ${Math.round(100 / (100 - n))} slides`;
}
function paintMix(n) {
  $('mixn').textContent = `${n} in 100 are clips`;
  $('mixw').textContent = mixWords(n);
  $('mixr').style.setProperty('--p', n + '%');
}
function renderMix() {
  const box = $('mixbox');
  box.hidden = !reachable || !lib.folders?.length;
  if (mixSaved != null && lib.mix === mixSaved) mixSaved = null;
  const n = mixSaved ?? lib.mix ?? 11;
  if (!box.firstChild) {
    box.innerHTML = `<section class="mix" aria-labelledby="mixh">
      <div class="mixtop"><h2 id="mixh">Photos and clips</h2><span class="mixn" id="mixn"></span></div>
      <input type="range" id="mixr" min="0" max="100" step="1" aria-labelledby="mixh" aria-describedby="mixw">
      <div class="mixends"><span>More photos</span><span id="mixw"></span><span>More clips</span></div>
      <div class="mixlinks"><a href="#/all/rank">Photo ranking ${CHEV(1)}</a><a href="#/all/clips">Clip ranking ${CHEV(1)}</a></div></section>`;
    const r = $('mixr');
    r.oninput = () => paintMix(+r.value);
    r.onchange = () => {
      const v = +r.value; mixSaved = v; clearTimeout(mixT);
      mixT = setTimeout(() => post('/mix', { clips: v }).then(() => toast(`${v} in 100 slides are clips now. The TV picks it up in a minute or two.`), err => toast(err.message, true)), 200);
    };
  }
  if (document.activeElement !== $('mixr') || mixSaved == null) { $('mixr').value = n; paintMix(n); }
}

function stateLine(x) {
  const lvl = x.level !== 'normal' && x.state === 'on' ? `<span>${LEVELS.find(l => l[0] === x.level)[1]}</span>` : '';
  const s = { on: 'On TV', off: '<b class="off">Off</b>', similar: 'Similar photo shown instead', new: 'Being added', season: 'Waits for its dates' }[x.state];
  return `<div class="st"><span>${s}</span>${lvl}</div>`;
}
function renderFolder(f) {
  $('nowbox').hidden = true; $('mixbox').hidden = true;

    : '<p class="empty">This folder is empty. Use Add photos, or drop photos anywhere on this page.</p>');
  placePill();

}

// ---------- schedule: a folder shows only between two dates each year ----------
function scheduleMenu(btn, name) {
  const f = lib.folders.find(x => x.name === name); if (!f) return;
  const cur = f.schedule || f.suggest?.[0] || { from: '11-20', to: '01-06' };
  let ranged = !!f.schedule;
  const days = m => [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31][m - 1];
  const sel = (id, n, v, lab) => `<select id="${id}" aria-label="${lab}">${Array.from({ length: n }, (_, i) => `<option value="${i + 1}" ${i + 1 === v ? 'selected' : ''}>${id.endsWith('m') ? MON[i] : i + 1}</option>`).join('')}</select>`;
  const pick = (k, mmdd) => `${sel(k + 'm', 12, +mmdd.slice(0, 2), k === 'f' ? 'Start month' : 'End month')}${sel(k + 'd', days(+mmdd.slice(0, 2)), +mmdd.slice(3), k === 'f' ? 'Start day' : 'End day')}`;
  const chips = (f.suggest || []).map((x, j) => `<button type="button" data-chip="${j}" class="${x.name === 'From these photos' ? 'mine' : ''}">${esc(x.name)}<span>${esc(x.label)}</span></button>`).join('');
  openMenu(btn, `<div class="h">When ${esc(name)} is on the TV</div>
    ${check('all', 'All year', !ranged)}${check('range', 'Only between these dates', ranged)}
    <div class="dates ${ranged ? '' : 'dis'}" id="dates"><span>From</span>${pick('f', cur.from)}<span>To</span>${pick('t', cur.to)}</div>
    ${chips ? `<hr><div class="h">Suggestions</div><div class="chips">${chips}</div>` : ''}
    <div class="t" id="schint" style="padding-top:2px"></div>
    <div class="row"><button class="btn" data-k="no" type="button">Cancel</button><button class="btn primary" data-k="ok" type="button">Save</button></div>`, m => {
    const two = n => String(n).padStart(2, '0');
    const val = k => `${two($(k + 'm').value)}-${two($(k + 'd').value)}`;
    const hint = () => {
      if (!ranged) { $('schint').textContent = 'Shows all year, like now.'; return; }
      const f0 = val('f'), t0 = val('t');
      $('schint').textContent = f0 === t0 ? 'Pick two different dates.' : `Shows from ${MON[+f0.slice(0, 2) - 1]} ${+f0.slice(3)} to ${MON[+t0.slice(0, 2) - 1]} ${+t0.slice(3)} every year${f0 > t0 ? ', across New Year' : ''}. The rest of the year it stays off the TV.`;
    };
    const fixDays = k => { const mm = +$(k + 'm').value, d = Math.min(+$(k + 'd').value, days(mm)); $(k + 'd').outerHTML = sel(k + 'd', days(mm), d, k === 'f' ? 'Start day' : 'End day'); $(k + 'd').onchange = hint; };
    const setMode = r => {
      ranged = r;
      m.querySelector('[data-k=all]').setAttribute('aria-checked', !r); m.querySelector('[data-k=all] .ck').textContent = r ? '' : '✓';
      m.querySelector('[data-k=range]').setAttribute('aria-checked', r); m.querySelector('[data-k=range] .ck').textContent = r ? '✓' : '';
      $('dates').classList.toggle('dis', !r); hint();
    };
    for (const k of ['f', 't']) { $(k + 'm').onchange = () => { fixDays(k); hint(); }; $(k + 'd').onchange = hint; }
    m.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
      const x = f.suggest[+b.dataset.chip];
      $('fm').value = +x.from.slice(0, 2); fixDays('f'); $('fd').value = +x.from.slice(3);
      $('tm').value = +x.to.slice(0, 2); fixDays('t'); $('td').value = +x.to.slice(3);
      setMode(true);
    });
    onKey(m, {
      all: () => setMode(false), range: () => setMode(true), no: closeMenu,
      ok: () => {
        if (ranged && val('f') === val('t')) return hint();
        act('/folder/schedule', ranged ? { name, from: val('f'), to: val('t') } : { name, always: true }, r => r.text === 'Always' ? `${name} shows all year.` : `${name}: ${r.text}.`);
      },
    });
    hint();
  });
}

// ---------- now on TV ----------
const EYEOFF = '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5 0 8.6 4.2 9.6 6.5a1.4 1.4 0 0 1 0 1c-.4.9-1.2 2.2-2.4 3.4M6.6 6.6C4.6 8 3.1 10 2.4 11.5a1.4 1.4 0 0 0 0 1C3.4 14.8 7 19 12 19c1.8 0 3.4-.5 4.8-1.3"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
let nowData = null, nowKey = '', nowT = null, nowDir = 0;
const byId = () => Object.fromEntries(lib.folders.flatMap(f => f.files.filter(x => x.id).map(x => [x.id, { ...x, folder: f.name }])));
async function pollNow(fast = false) {
  clearTimeout(nowT);
  if (!document.hidden && !inner()) {
    try { nowData = await fetch(BRIDGE + '/now', { cache: 'no-store' }).then(r => r.json()); } catch { nowData = null; }
    renderNow();
  }

}
function renderNow() {
  const box = $('nowbox'); if (inner()) return;
  const n = nowData?.now, live = n && nowData.age != null && nowData.age < 150;
  const ids = live ? (n.members?.length ? n.members : [n.id]) : [];
  const key = live ? ids.join('+') : 'off';
  if (key === nowKey && box.firstElementChild) return;
  nowKey = key;
  if (!live) {
    box.innerHTML = `<div class="now off"><div class="txt"><div class="k"><i></i>Now on TV</div><div class="m">The TV is not showing photos right now.</div></div></div>`;
    return;
  }
  const m = byId(), ps = ids.map(id => m[id]).filter(Boolean);
  const places = [...new Set(ps.map(p => p.place).filter(Boolean))];
  const dates = [...new Set(ps.map(p => fmtDate(p.date)).filter(Boolean))];
  const title = places.join(' and ') || dates[0] || (ps[0]?.file ?? 'A photo');
  const sub = [places.length ? dates.join(', ') : '', ps.length > 1 ? `${ps.length} photos side by side` : '', n.role === 'home' ? 'behind the home screen' : ''].filter(Boolean).join(' · ');
  box.innerHTML = `<div class="now"><div class="thumbs swap" style="--from:${nowDir * 10}px">${ps.map(p => `<img src="${esc(p.thumb)}" alt="">`).join('')}</div>
    <div class="txt swap" style="--from:${nowDir * 10}px"><div class="k"><i></i>Now on TV</div><div class="l">${esc(title)}</div>${sub ? `<div class="m">${esc(sub)}</div>` : ''}</div>
    <div class="ctl">${ps.length === 1 ? `<button class="dots fav${ps[0].level === 'fav' ? ' on' : ''}" type="button" id="nowfav" aria-pressed="${ps[0].level === 'fav'}" aria-label="${ps[0].level === 'fav' ? 'Remove from favorites' : 'Favorite: comes up the most'}">${HEART(ps[0].level === 'fav')}</button>` : ''}<button class="dots" type="button" id="nowhide" aria-label="${ps.length === 1 ? 'Hide from TV' : 'Hide one of these from TV'}" title="Hide from TV">${EYEOFF}</button><button class="dots" type="button" data-cmd="prev" aria-label="Previous photo">${CHEV(0)}</button>
      <button class="dots" type="button" data-cmd="next" aria-label="Next photo">${CHEV(1)}</button>
      <button class="dots" type="button" id="nowmenu" aria-label="Options for this photo" aria-haspopup="menu">${DOTS}</button></div></div>`;
  nowDir = 0;
  box.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => skip(b.dataset.cmd));
  const fb = $('nowfav');
  if (fb) fb.onclick = () => {
    const p = ps[0], on = p.level !== 'fav';
    act('/boost', { id: p.id, level: on ? 'fav' : 'normal' }, () => { p.level = on ? 'fav' : 'normal'; nowKey = ''; renderNow(); return on ? 'A favorite now. It comes up the most.' : 'Not a favorite any more.'; });
  };
  $('nowhide').onclick = e => ps.length === 1
    ? act('/hide', { id: ps[0].id, hidden: true }, () => { skip('next'); return 'Off the TV. Skipped to the next photo.'; })
    : nowMenu(e.currentTarget, ps);

async function skip(cmd) {
  try {
    const r = await fetch(BRIDGE + '/cmd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ cmd }) }).then(r => r.json());
    if (!r.ok) throw new Error(r.error || 'The TV did not take it.');

function nowMenu(btn, ps) {

// ---------- rebuild progress ----------
let prog = null, progT = null, progOpen = false;
document.addEventListener('click', e => { if (e.target.closest('.prog.compact') || (inner() && e.target.closest('.prog .top'))) { progOpen = !progOpen; renderProg(); } });
window.addEventListener('hashchange', () => { progOpen = false; renderProg(); });
const dur = s => s == null ? '' : s < 60 ? `${s} s` : s < 3600 ? `${Math.round(s / 60)} min` : `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min`;
async function pollProg() {
  clearTimeout(progT);
  if (!document.hidden) {
    try { prog = await fetch(API + '/progress', { cache: 'no-store' }).then(r => r.json()); } catch { prog = null; }
    renderProg();
  }
  progT = setTimeout(pollProg, prog?.state === 'running' ? 3000 : 20000);
}
function renderProg() {
  const box = $('progbox'), p = prog;
  if (!p || (p.state !== 'running' && p.state !== 'failed')) {
    box.innerHTML = '';
    if (!uploading) { $('progress').hidden = true; }
    return;
  }
  const run = p.steps.find(s => s.state === 'running'), pct = p.percent ?? 0;
  if (!uploading) { $('progress').hidden = false; $('progress').firstElementChild.style.width = pct + '%'; }
  const g = p.gpu, gpuNow = run?.gpu;
  const gline = g ? `<span class="meter" style="--p:${g.util / 100}"><i></i></span><span>GPU ${g.util}% busy${g.encoders ? ` · ${g.encoders} video encoder${g.encoders > 1 ? 's' : ''}` : ''} · ${(g.mem_used / 1024).toFixed(1)} of ${Math.round(g.mem_total / 1024)} GB.
      ${p.gpu_done.length ? 'Done on the GPU: ' + esc(p.gpu_done.join(', ')) + '.' : gpuNow ? 'Its first GPU step is running now.' : 'No GPU steps yet.'}</span>` : '';
  const li = s => `<li class="${s.state}"><span class="ic">${s.state === 'done' ? '✓' : s.state === 'failed' ? '!' : ''}</span>
      <span>${esc(s.label)}${s.gpu ? '<span class="chip">GPU</span>' : ''}</span>
      <span class="r">${s.state === 'done' ? dur(s.secs) : s.state === 'running' ? (s.of ? `${s.count.toLocaleString()} of ${s.of.toLocaleString()} ${s.unit} · ` : '') + dur(s.secs) : ''}</span></li>`;
  const fail = p.state === 'failed';
  const html = `<section class="prog ${fail ? 'fail' : ''} ${inner() && !progOpen ? 'compact' : ''}" aria-label="TV update progress">
    <div class="top"><div><div class="ttl">${fail ? 'The last TV update stopped' : 'Updating the TV'}</div>
      <div class="sub">${fail ? 'It tries again by itself in 10 minutes. Log: real/library.log on the server.' : `${run ? esc(run.label) : 'Starting'} · ${dur(p.elapsed)} so far`}</div></div>
      ${fail ? '' : `<div class="pct">${pct}%</div>`}</div>
    ${fail ? '' : `<div class="track"><i style="--p:${pct / 100}"></i></div>`}
    <ol>${p.steps.map(li).join('')}</ol>
    ${gline ? `<div class="gpu">${gline}</div>` : ''}</section>`;
  // update in place so the bars glide instead of jumping
  const old = box.firstElementChild;
  if (old) old.classList.toggle('compact', inner() && !progOpen);
  if (old && old.classList.contains('fail') === fail) {
    const t = document.createElement('div'); t.innerHTML = html; const nw = t.firstElementChild;
    old.querySelector('.top').innerHTML = nw.querySelector('.top').innerHTML;
    old.querySelector('ol').innerHTML = nw.querySelector('ol').innerHTML;
    const tr = old.querySelector('.track i'); if (tr) tr.style.setProperty('--p', pct / 100);
    const go = old.querySelector('.gpu'), gn = nw.querySelector('.gpu');
    if (go && gn) { go.querySelector('.meter i') && go.querySelector('.meter').style.setProperty('--p', g.util / 100); go.lastElementChild.innerHTML = gn.lastElementChild.innerHTML; }
  } else box.innerHTML = html;
}

// ---------- ranking ----------

  } else psel.has(id) ? psel.delete(id) : psel.add(id);
  panchor = id; paintPsel();
}
const photoTab = () => (isAll() && atab() === 'rank') || (!isAll() && tab() === 'rank');
let photobar = null;
function updatePhotoBar(bump) {
  if (!photobar) {
    photobar = document.createElement('div'); photobar.className = 'selbar'; photobar.id = 'photobar'; photobar.setAttribute('role', 'toolbar'); photobar.setAttribute('aria-label', 'Selected photos');
    photobar.innerHTML = `<div class="lead"><button class="x" type="button" data-pb="clear" aria-label="Clear selection" title="Clear selection (Esc)">${IC.x}</button><span class="n" id="pseln" aria-live="polite"></span><button class="all" type="button" data-pb="all" id="pselall"></button></div><span class="sep"></span>
      <div class="acts"><button class="btn" type="button" data-pb="show" title="Put them on the TV">${IC.show}<span>Include</span></button>
      <button class="btn" type="button" data-pb="hide" title="Take them off the TV">${IC.hide}<span>Exclude</span></button>
      <button class="btn" type="button" data-pb="often" data-mb aria-haspopup="menu">${IC.often}<span><span class="lg">How often</span><span class="sh">Often</span></span></button><span class="sep"></span>
      <button class="btn" type="button" data-pb="fill" title="Each one fills the screen, cropped around what matters in it">${IC3.fill}<span><span class="lg">Fill screen</span><span class="sh">Fill</span></span></button>
      <button class="btn" type="button" data-pb="whole" title="Each one shows whole, on a blurred copy of itself">${IC3.whole}<span><span class="lg">Whole photo</span><span class="sh">Whole</span></span></button>
      <button class="btn" type="button" data-pb="auto" title="Let the TV decide, as before">${IC2.best}<span>Auto</span></button>
      <button class="btn" type="button" data-pb="frame" title="Pick the part of each that fills the screen, one after another">${IC3.crop}<span>Crop…</span></button></div>`;
    document.body.appendChild(photobar);
    photobar.addEventListener('click', e => {
      const b = e.target.closest('[data-pb]'); if (!b) return;
      const k = b.dataset.pb, ids = pOrder.filter(i => psel.has(i));
      if (k === 'clear') { psel.clear(); panchor = null; return paintPsel(); }
      if (k === 'all') { pOrder.forEach(i => psel.add(i)); return paintPsel(); }
      if (k === 'often') {
        const lv = new Set(ids.map(i => rankData.photos.find(r => r.id === i)?.level));
        return menu.hidden || opener !== b ? openMenu(b, `<div class="h">How often ${ids.length === 1 ? 'it comes' : `these ${nf(ids.length)} come`} up</div>${LEVELS.map(([k, l]) => check('lv-' + k, l, lv.size === 1 && lv.has(k))).join('')}`,
          m => onKey(m, Object.fromEntries(LEVELS.map(([k]) => ['lv-' + k, () => { closeMenu(); photoBulk('level', { level: k }); }])))) : closeMenu();
      }
      if (k === 'frame') return openFrame(ids);
      photoBulk(k);
    });
  }
  const n = pOrder.filter(i => psel.has(i)).length, on = n > 0 && photoTab();
  photobar.classList.toggle('show', on);
  document.body.classList.toggle('pselecting', on);
  if (!on) return;
  $('pseln').textContent = `${nf(n)} selected`;
  if (bump) { $('pseln').classList.remove('bump'); void $('pseln').offsetWidth; $('pseln').classList.add('bump'); }
  $('pselall').hidden = n === pOrder.length;
  $('pselall').textContent = `Select all ${nf(pOrder.length)}`;
}
window.addEventListener('hashchange', () => { psel.clear(); panchor = null; updatePhotoBar(); });
async function photoBulk(k, extra = {}) {
  const ids = pOrder.filter(i => psel.has(i)); if (!ids.length) return;
  const frame = ['fill', 'whole', 'auto'].includes(k), what = plural(ids.length, 'photo', 'photos');
  let r;
  try { r = await post('/bulk', frame ? { action: 'frame', ids, frame: k } : { action: k, ids, ...extra }); }
  catch (e) { return toast(e.message, true); }
  psel.clear(); panchor = null; updatePhotoBar();
  const msg = k === 'show' ? `${what} on the TV in a few seconds.` : k === 'hide' ? `${what} off the TV in a few seconds.`
    : k === 'level' ? `${what} set to ${(LEVELS.find(l => l[0] === extra.level)?.[1] || 'Normal').toLowerCase()}.`
    : !r.changed ? 'Nothing to change: they are already framed that way.'
    : `${what} set to ${k === 'fill' ? 'fill the screen' : k === 'whole' ? 'show whole' : 'the automatic framing'}. The TV gets the new frames in a minute or two.`;
  toast(msg, false, r.changed === false ? null : async () => { try { await post('/bulk', r.undo); } catch (e) { return toast(e.message, true); } toast('Undone.'); refetchPhotos(); });
  refetchPhotos();
}
document.addEventListener('click', e => {
  const cb = e.target.closest('[data-psel]');
  if (cb) { e.preventDefault(); return ppick(cb.dataset.psel, e.shiftKey); }
  const fb = e.target.closest('[data-frame]');
  if (fb) return openFrame([fb.dataset.frame]);
  const tr = psel.size && !e.target.closest('button,a,input') && e.target.closest('.rk tr.row[data-pid]');
  if (tr) ppick(tr.dataset.pid, e.shiftKey);
});
document.addEventListener('mousedown', e => { if (e.shiftKey && e.target.closest('.rk tr.row[data-pid]')) e.preventDefault(); });
window.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || !psel.size || !photoTab() || !menu.hidden || $('viewer').open || $('framedlg')?.open) return;
  e.preventDefault(); psel.clear(); panchor = null; paintPsel();
}, true);

// point at a photo: how it looks on the TV
let phov = null, phovId = null, phovWant = null, phovT = null;
document.addEventListener('mouseover', e => {
  if (!HOVER.matches) return;
  const tr = e.target.closest('.rk tr.row[data-pid]'), id = tr && e.target.closest('td.th,td.fn') ? tr.dataset.pid : null;
  if (id === phovWant) return;
  phovWant = id; clearTimeout(phovT);
  phovT = id ? setTimeout(() => showPhov(id, tr), phovId ? 40 : 200) : setTimeout(hidePhov, 90);
});
window.addEventListener('scroll', () => { if (phovId || phovWant) { clearTimeout(phovT); phovWant = null; hidePhov(); } }, { passive: true });
function showPhov(id, tr) {
  const r = rankData?.photos.find(r => r.id === id), cell = tr.querySelector('td.fn');
  if (!r?.thumb || !cell || !tr.isConnected || $('framedlg')?.open) return;
  if (!phov) { phov = document.createElement('div'); phov.className = 'hov'; phov.setAttribute('aria-hidden', 'true'); document.body.appendChild(phov); }
  if (phovId !== id) phov.innerHTML = `${tvPic(bigOf(r), r.fr)}<div class="hc"><b>${esc(r.file)}</b><span>${r.reframing ? 'Being framed again' : r.fr ? (r.fr.box ? 'Fills the screen' : 'Whole, on a backdrop') : ''}</span></div>`;
  phovId = id;
  const b = cell.getBoundingClientRect(), w = phov.offsetWidth, h = w * 9 / 16 + 37, gap = 14;
  let x = b.right + gap, y = b.top + b.height / 2 - h / 2;
  if (x + w > innerWidth - 12) x = b.left - w - gap;
  if (x < 12) { x = Math.max(12, Math.min(innerWidth - w - 12, b.left)); y = b.bottom + 8 + h > innerHeight - 12 ? b.top - h - 8 : b.bottom + 8; }
  phov.style.left = `${Math.round(x)}px`; phov.style.top = `${Math.round(Math.max(12, Math.min(innerHeight - h - 12, y)))}px`;
  phov.classList.add('show');
}
function hidePhov() { phovId = null; phov?.classList.remove('show'); }

// the framing editor: the photo with the part that fills the screen, one photo at a time
const FR = { ids: [], i: 0, r: null, box: null, mode: 'auto', undo: {}, saved: 0, drag: null };
const AR = 16 / 9;
function frameDlg() {
  let dl = $('framedlg'); if (dl) return dl;
  dl = document.createElement('dialog'); dl.className = 'trim frame'; dl.id = 'framedlg'; dl.setAttribute('aria-labelledby', 'frn');
  dl.innerHTML = `<div class="top"><div class="tt"><b id="frn"></b><span class="of" id="frof"></span></div><button class="x" type="button" data-fr="close" aria-label="Close">×</button></div>
    <div class="stage2"><div class="pic" id="frpic"><img id="frimg" alt=""><span class="wholeln" id="frwl" hidden></span>
      <span class="bx" id="frbx" tabindex="0" role="group" aria-label="The part that fills the TV. Drag it, or use the arrow keys; plus and minus change its size"><i class="cr nw" data-c="nw"></i><i class="cr ne" data-c="ne"></i><i class="cr sw" data-c="sw"></i><i class="cr se" data-c="se"></i></span></div></div>
    <div class="sub"><span id="frtv"></span><div class="tm" id="frm" aria-live="polite"></div></div>
    <div class="ta"><span class="grp"><button class="btn" type="button" data-fr="auto" id="frau">${IC2.best}Auto</button><button class="btn" type="button" data-fr="fill" id="frfi">${IC3.fill}Fill screen</button><button class="btn" type="button" data-fr="whole" id="frwh">${IC3.whole}Whole photo</button></span>
      <span class="sp"></span><button class="btn" type="button" data-fr="skip" id="frsk">Skip</button><button class="btn primary" type="button" data-fr="save" id="frsv">Save</button></div>`;
  document.body.appendChild(dl);
  dl.addEventListener('click', e => {
    const b = e.target.closest('[data-fr]'); if (!b) return;
    const k = b.dataset.fr, fr = FR.r.fr;
    if (k === 'close') return dl.close();
    if (k === 'auto') { FR.mode = 'auto'; FR.box = fr.auto && [...fr.auto]; return frPaint(); }
    if (k === 'fill') { FR.mode = 'fill'; FR.box = focalBox(fr); return frPaint(); }
    if (k === 'whole') { FR.mode = 'whole'; FR.box = null; return frPaint(); }
    if (k === 'skip') return frNext();
    if (k === 'save') return frSave(b);
  });
  dl.addEventListener('close', frDone);
  const pic = $('frpic'), bx = $('frbx');
  bx.addEventListener('pointerdown', e => {
    if (!FR.box) return;
    e.preventDefault(); bx.setPointerCapture(e.pointerId); bx.focus({ preventScroll: true });
    const r = pic.getBoundingClientRect();
    FR.drag = { c: e.target.dataset.c || 'move', x: e.clientX, y: e.clientY, w: r.width, h: r.height, b: [...FR.box] };
  });
  bx.addEventListener('pointermove', e => {
    const d = FR.drag; if (!d) return;
    const dx = (e.clientX - d.x) / d.w, dy = (e.clientY - d.y) / d.h, [x0, y0, x1, y1] = d.b;
    if (d.c === 'move') frSet([x0 + dx, y0 + dy, x1 + dx, y1 + dy]);
    else {   // resize from a corner, the opposite corner stays put, always the screen's shape
      const ax = d.c.includes('w') ? x1 : x0, ay = d.c.includes('n') ? y1 : y0;
      const px = (d.c.includes('w') ? x0 : x1) + dx;
      let bw = Math.abs(px - ax);
      bw = Math.max(bw, .08); const bh = bw * FR.r.fr.w / FR.r.fr.h / AR;
      frSet([d.c.includes('w') ? ax - bw : ax, d.c.includes('n') ? ay - bh : ay, d.c.includes('w') ? ax : ax + bw, d.c.includes('n') ? ay : ay + bh], true);
    }
  });
  const up = () => { FR.drag = null; }; bx.addEventListener('pointerup', up); bx.addEventListener('pointercancel', up);
  bx.addEventListener('keydown', e => {
    if (!FR.box) return;
    const st = e.shiftKey ? .05 : .01, [x0, y0, x1, y1] = FR.box;
    const mv = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] }[e.key];
    if (mv) { e.preventDefault(); return frSet([x0 + mv[0], y0 + mv[1], x1 + mv[0], y1 + mv[1]]); }
    if (e.key === '+' || e.key === '=' || e.key === '-') {
      e.preventDefault();
      const f = e.key === '-' ? 1.05 : 1 / 1.05, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, hw = (x1 - x0) * f / 2, hh = (y1 - y0) * f / 2;
      frSet([cx - hw, cy - hh, cx + hw, cy + hh], true);
    }
  });
  return dl;
}
// the largest screen-shaped part around the focal point (server/prepare.py cover_box)
function focalBox(fr) {
  const iw = fr.w, ih = fr.h, [fx, fy] = fr.focal || [.5, .5];
  let cw, ch; if (iw / ih > AR) { ch = ih; cw = ih * AR; } else { cw = iw; ch = iw / AR; }
  const x0 = Math.min(Math.max(fx * iw - cw / 2, 0), iw - cw), y0 = Math.min(Math.max(fy * ih - ch / 2, 0), ih - ch);
  return [x0 / iw, y0 / ih, (x0 + cw) / iw, (y0 + ch) / ih];
}
function frSet(b, resize) {
  const fr = FR.r.fr, k = fr.w / fr.h / AR;          // box height per width, in 0..1 of the photo
  let [x0, y0, x1, y1] = b, w = x1 - x0;
  w = Math.min(w, 1, 1 / k); w = Math.max(w, .08);
  const h = w * k;
  if (resize) { const cx = Math.min(Math.max((x0 + x1) / 2, w / 2), 1 - w / 2), cy = Math.min(Math.max((y0 + y1) / 2, h / 2), 1 - h / 2); x0 = cx - w / 2; y0 = cy - h / 2; }
  x0 = Math.min(Math.max(x0, 0), 1 - w); y0 = Math.min(Math.max(y0, 0), 1 - h);
  FR.box = [x0, y0, x0 + w, y0 + h]; FR.mode = 'crop'; frPaint();
}
function frPaint() {
  const fr = FR.r.fr, b = FR.box, bx = $('frbx');
  bx.hidden = !b; $('frwl').hidden = !!b;
  if (b) Object.assign(bx.style, { left: `${b[0] * 100}%`, top: `${b[1] * 100}%`, width: `${(b[2] - b[0]) * 100}%`, height: `${(b[3] - b[1]) * 100}%` });
  $('frtv').innerHTML = tvPic(bigOf(FR.r), { box: b });
  const px = b ? Math.round((b[2] - b[0]) * fr.w) : 0, soft = b && px < 2400;
  $('frm').innerHTML = !b ? `<span><b>Whole photo</b>, on a blurred copy of itself</span><span>Nothing is cut off</span>`
    : `<span><b>Fills the screen</b>${FR.mode === 'crop' ? ', your crop' : FR.mode === 'auto' ? ', as the TV picks' : ''}</span><span>Keeps ${Math.round((b[2] - b[0]) * (b[3] - b[1]) * 100)}% of the photo</span>${soft ? `<span class="warn">Only ${nf(px)} px wide for a 3,840 px screen: it will look soft</span>` : ''}`;
  $('frau').setAttribute('aria-pressed', FR.mode === 'auto'); $('frfi').setAttribute('aria-pressed', FR.mode === 'fill'); $('frwh').setAttribute('aria-pressed', FR.mode === 'whole');
}
function openFrame(ids) {
  ids = ids.filter(i => rankData?.photos.some(r => r.id === i && r.fr)); if (!ids.length) return toast('That photo is still being added. Try again in a few minutes.', true);
  hidePhov(); phovWant = null;
  const dl = frameDlg();
  Object.assign(FR, { ids, i: 0, undo: {}, saved: 0 });
  frLoad(); dl.showModal();
}
function frLoad() {
  const r = rankData.photos.find(r => r.id === FR.ids[FR.i]), f = r.fr;
  FR.r = r;
  FR.mode = !f.fit ? 'auto' : f.fit.box ? 'crop' : f.fit.fit;
  FR.box = f.box && [...f.box];
  $('frn').textContent = r.file;
  $('frof').textContent = FR.ids.length > 1 ? `${FR.i + 1} of ${FR.ids.length}` : '';
  $('frsk').hidden = FR.i >= FR.ids.length - 1;
  $('frsv').textContent = FR.i < FR.ids.length - 1 ? 'Save, next photo' : 'Save';
  $('frimg').src = bigOf(r);
  frPaint();
}
async function frSave(btn) {
  const id = FR.ids[FR.i], frame = FR.mode === 'crop' ? { box: FR.box.map(v => +v.toFixed(4)) } : FR.mode;
  btn.disabled = true;
  try {
    const r = await post('/bulk', { action: 'frame', ids: [id], frame });
    for (const [k, v] of Object.entries(r.undo?.prev || {})) if (!(k in FR.undo)) FR.undo[k] = v;
    if (r.changed) FR.saved++;
  } catch (e) { btn.disabled = false; return toast(e.message, true); }
  btn.disabled = false;
  frNext();
}
function frNext() { if (FR.i < FR.ids.length - 1) { FR.i++; frLoad(); } else $('framedlg').close(); }
function frDone() {
  if (!FR.saved) return;
  const undo = { action: 'restore', prev: FR.undo }, n = FR.saved;
  FR.saved = 0;
  if (FR.ids.length > 1) { psel.clear(); panchor = null; updatePhotoBar(); }
  toast(`${plural(n, 'photo', 'photos')} framed. The TV gets the new frames in a minute or two.`, false, async () => {
    try { await post('/bulk', undo); } catch (e) { return toast(e.message, true); }
    toast('Undone.'); refetchPhotos();
  });
  refetchPhotos();
}

// ---------- toast ----------
let toastT;
function toast(msg, bad = false, undo = null) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button class="u" type="button">Undo</button>' : ''}`;
  t.classList.toggle('bad', bad); t.classList.toggle('act', !!undo); t.classList.add('show');
  if (undo) t.querySelector('.u').onclick = () => { t.classList.remove('show', 'act'); clearTimeout(toastT); undo(); };
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show', 'act'), undo ? 7000 : bad ? 5000 : 2500);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); pollNow(); pollProg(); } });
refresh().then(() => { pollNow(); pollProg(); });
</script>
