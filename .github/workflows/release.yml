# On a version tag (v0.4.0): the TV app, signed with the project key, and the server images, ready for an
# installer that downloads instead of building. Needs these repository secrets for the app:
#   APK_KEYSTORE_BASE64 (base64 of the .jks), APK_KEYSTORE_PASSWORD, APK_KEY_ALIAS, APK_KEY_PASSWORD
# See docs/RELEASING.md.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Signing key
        working-directory: android
        env:
          KEYSTORE: ${{ secrets.APK_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          KEY_PW: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "::error::APK_KEYSTORE_BASE64 is not set (docs/RELEASING.md)"; exit 1; }
          mkdir -p keystore && echo "$KEYSTORE" | base64 -d > keystore/release.jks
          printf 'storeFile=keystore/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$ALIAS" "$KEY_PW" > keystore/key.properties
      - name: Build
        working-directory: android
        run: ./gradlew -q --no-daemon assembleRelease
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "tvframe-${GITHUB_REF_NAME}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk tvframe.apk       # releases/latest/download/tvframe.apk
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --generate-notes
          gh release upload "$GITHUB_REF_NAME" "tvframe-${GITHUB_REF_NAME}.apk" tvframe.apk --clobber

  server:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        torch: [cu128, cpu]
    steps:
      - uses: actions/checkout@v5
      - name: Room for the CUDA image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH=${{ matrix.torch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.torch }}
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}-${{ matrix.torch }}
